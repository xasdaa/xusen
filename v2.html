<!doctype html>
<html lang="en">
<head>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#000}
    .cover{position:relative;isolation:isolate;width:100%;height:100svh;overflow:hidden;background:#000}
    .desktop-cover{display:block;width:100%;height:100%}
    .desktop-cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:83% center;user-select:none}
    .mobile-cover{display:none}
    ::selection{background:#666;color:#fff}
    @media(max-width:767px),(max-aspect-ratio:4/5){
      .desktop-cover{display:none}
      .mobile-cover{display:block;position:absolute;inset:0;isolation:isolate;background:radial-gradient(ellipse 145% 72% at 0% -12%,#191919 0%,#0c0c0c 38%,#020202 66%,#000 85%)}
      .mobile-cover:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='white' filter='url(%23grain)' d='M0 0h160v160H0z'/%3E%3C/svg%3E");background-size:160px 160px;mask-image:linear-gradient(#000,transparent 62%)}
      .mobile-copy{position:absolute;right:12%;top:49%;display:flex;flex-direction:column;align-items:flex-end;gap:clamp(12px,2.3svh,23px);margin:0;color:#969693;font-family:"Times New Roman",Georgia,serif;font-size:clamp(16px,4.7vw,22px);font-weight:400;line-height:1.2;letter-spacing:-.5px;text-align:right}
      .mobile-copy span{display:block;white-space:nowrap}
    }
    @media(min-width:768px) and (max-aspect-ratio:4/5){.mobile-copy{right:16%;font-size:clamp(22px,2.8vw,28px);gap:clamp(20px,2.3svh,30px)}}
    @media(max-height:650px) and (max-width:767px){.mobile-copy{top:46%;font-size:16px;gap:12px}}
    @media(max-height:450px) and (max-width:767px){.mobile-copy{top:34%;font-size:14px;gap:9px}}

    .selected{--inset:max(6vw,calc((100vw - 1120px)/2));--gap:24px;padding:110px 0 100px;overflow:hidden;color:#f5f5f7;font-family:Arial,"Microsoft YaHei",sans-serif}
    .selected h2{margin:0 var(--inset) 42px;font-size:clamp(30px,3vw,48px);line-height:1.1;letter-spacing:-1.6px;font-weight:600}
    .project-track{display:flex;gap:var(--gap);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-left:var(--inset);padding:0 var(--inset);scrollbar-width:none}
    .project-track::-webkit-scrollbar{display:none}
    .project{flex:0 0 min(44vw,680px);min-width:0;margin:0;scroll-snap-align:start}
    .project picture{display:block;overflow:hidden;border:1px solid #202020;border-radius:24px;background:#090909}
    .project img{display:block;width:100%;height:auto;aspect-ratio:2.35/1;object-fit:contain}
    .project figcaption{max-width:440px;margin:24px 14px 0;color:#858589;font-size:16px;line-height:1.65;letter-spacing:-.2px}
    .project strong{color:#ededf0;font-weight:600}
    .gallery-controls{display:flex;justify-content:flex-end;gap:16px;margin:40px var(--inset) 0}
    .gallery-controls button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:#303032;color:#eee;cursor:pointer;transition:background .2s,opacity .2s}
    .gallery-controls button:disabled{background:#171718;color:#5b5b5e;cursor:default}
    .gallery-controls button:hover:not(:disabled){background:#48484b}
    .gallery-controls button:focus-visible,.project-track:focus-visible{outline:2px solid #fff;outline-offset:5px}
    .gallery-controls svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:767px){
      .selected{--inset:7vw;--gap:20px;padding:72px 0 64px}
      .selected h2{font-size:clamp(27px,7vw,36px);letter-spacing:-1px;margin-bottom:30px}
      .project{flex-basis:74vw}
      .project picture{border-radius:24px}
      .project img{aspect-ratio:3/4}
      .project figcaption{margin:20px 10px 0;font-size:15px;line-height:1.65}
      .gallery-controls{margin-top:34px;gap:14px}
    }
    @media(prefers-reduced-motion:reduce){.gallery-controls button{transition:none}}

    .motion{--inset:max(5vw,calc((100vw - 1440px)/2));--gap:24px;padding-bottom:30px}
    .motion-track{display:flex;gap:var(--gap);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-left:var(--inset);padding:0 var(--inset);scrollbar-width:none}
    .motion-track::-webkit-scrollbar{display:none}
    .motion-project{flex:0 0 min(86vw,1440px);min-width:0;margin:0;scroll-snap-align:start}
    .motion-video{display:block;width:100%;height:auto;aspect-ratio:2.35/1;object-fit:contain;background:#0a0a0a;border:0;border-radius:0}
    .motion-project figcaption{display:flex;align-items:baseline;gap:18px;margin:22px 0 0;color:#858589;font-size:13px;line-height:1.5}
    .motion-project strong{font-size:20px;color:#f5f5f7;font-weight:500;letter-spacing:-.5px}
    .motion-number{margin-left:auto;font-variant-numeric:tabular-nums}
    .motion-track:focus-visible,.motion-video:focus-visible{outline:2px solid #fff;outline-offset:-3px}
    @media(max-width:767px){
      .motion{--inset:0px;--gap:0px;padding:72px 0 24px}
      .motion h2{margin-left:7vw;margin-right:7vw}
      .motion-project{flex-basis:100%}
      .motion-video{aspect-ratio:3/4}
      .motion-project figcaption{margin:20px 7vw 0;gap:10px;flex-wrap:wrap;font-size:11px}
      .motion-project strong{font-size:18px}
      .motion .gallery-controls{margin-left:7vw;margin-right:7vw}
    }
  </style>

<body>

    <div class="gallery-controls" role="group" aria-label="切换动态作品">
      <button type="button" id="previous-motion" aria-label="上一个视频" aria-controls="motion-track" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>

  <script>
    (()=>{
      const track=document.getElementById('project-track');
      const previous=document.getElementById('previous-project');
      const next=document.getElementById('next-project');
      const reduced=matchMedia('(prefers-reduced-motion: reduce)');
      function update(){previous.disabled=track.scrollLeft<=2;next.disabled=track.scrollLeft>=track.scrollWidth-track.clientWidth-2;}
      function move(direction){const step=track.querySelector('.project').getBoundingClientRect().width+parseFloat(getComputedStyle(track).gap);track.scrollBy({left:direction*step,behavior:reduced.matches?'instant':'smooth'});}
      previous.addEventListener('click',()=>move(-1));
      next.addEventListener('click',()=>move(1));
      track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(e.key==='ArrowRight'?1:-1);}});
      track.addEventListener('scroll',update,{passive:true});
      new ResizeObserver(update).observe(track);
      update();
    })();
  </script>
  <script src="assets/v2/motion.js" defer></script>
